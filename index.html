<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Under Maintenance</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #172033;
      background: #f5f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 560px);
      padding: 48px 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #e6eaf0;
      border-radius: 20px;
      box-shadow: 0 16px 48px rgb(23 32 51 / 8%);
    }

    .icon {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      border-radius: 50%;
      color: #3457d5;
      background: #edf1ff;
      font-size: 36px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.7rem, 5vw, 2.25rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: #596579;
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      padding: 9px 14px;
      border-radius: 999px;
      color: #76500a;
      background: #fff6df;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e7a928;
    }

    footer {
      margin-top: 32px;
      color: #8a94a6;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🔧</div>
    <h1>We're performing maintenance</h1>
    <p>
      This service is temporarily unavailable while we carry out scheduled
      maintenance. Please check back in a little while. Thank you for your patience.
    </p>
    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      Maintenance in progress
    </div>
    <footer>&copy; <span id="year"></span> Your Application</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
